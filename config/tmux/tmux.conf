# Melhor prefixo (Ctrl+a em vez de Ctrl+b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split horizontal e vertical com atalhos simples
bind | split-window -h
bind - split-window -v

# Ativa mouse
set -g mouse on

# Melhora o scrollback
set -g history-limit 10000

# Atualiza status bar a cada segundo
set -g status-interval 1

# Permite recarregar o config sem fechar tmux
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Copiar usando buffer do sistema (clipboard do X/Wayland)
# OBS: precisa ter xclip ou xsel instalado
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"

# Tema simples
set -g status-bg colour235
set -g status-fg colour136
set -g status-left-length 40
set -g status-right-length 90
set -g status-left '#[fg=green]#H'
set -g status-right '#[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M'

# Atalhos Vi no copy mode
setw -g mode-keys vi

